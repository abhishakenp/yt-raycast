    <meta charset="UTF-8" />

    <meta name="description" content="Contact the --help team for sales, support, onboarding, or implementation questions." />

    <meta name="theme-color" content="#050506" />
    <meta name="keywords" content="--help, saas, User authentication, Subscription management, Payment processing, Analytics dashboard, Email notifications, Contact" />
    <meta property="og:type" content="website" />

    <meta property="og:site_name" content="--help" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Contact --help | Sales and Support" />

    <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebPage","name":"Contact --help | Sales and Support","description":"Contact the --help team for sales, support, onboarding, or implementation questions."}</script>
    
    <link rel="stylesheet" href="./site.css" />
  </head>
  <body>
    <div class="site-shell">
      
        <section class="section contact" id="contact-page">
          <div class="container contact-shell">
            <div>
              <h2>Talk to the --help team</h2>
              <p class="section-body">Share the product, workflow, or launch brief you need help with.</p>
            </div>
            <form class="contact-form" data-demo-form>
              
                  <label>
                    <span>Name</span>
                    <input type="text" name="name" placeholder="Jane Doe" required />
                  </label>
                
                  <label>
                    <span>Email</span>
                    <input type="email" name="email" placeholder="jane@company.com" required />
                  </label>
                
                  <label>
                    <span>Message</span>
                    <textarea name="message" placeholder="Tell us what you want to build." required></textarea>
                  </label>
                
              <button class="button button--primary" type="submit">Submit</button>
              <p class="form-message" data-form-message aria-live="polite"></p>
            </form>
          </div>
        </section>
      
    </div>
    <script src="./site.js"></script>
  </body>
</html>
