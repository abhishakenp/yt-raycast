<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Image Studio – Turn prompts into stunning AI‑generated images</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: Inter, system-ui, sans-serif; }
    .masonry { column-count: 1; column-gap: 1.5rem; }
    @media (min-width: 640px) { .masonry { column-count: 2; } }
    @media (min-width: 1024px) { .masonry { column-count: 3; } }
  </style>
</head>
<body class="bg-background text-text-primary">
  <nav class="flex items-center justify-between px-6 py-4 bg-surface border-b border-border">
    <div class="flex items-center gap-3">
      <svg class="w-7 h-7 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
      <span class="font-bold text-lg">AI Studio</span>
    </div>
    <div class="hidden md:flex items-center gap-6 text-sm font-medium">
      <a href="index.html" class="hover:text-primary transition">Home</a>
      <a href="models.html" class="hover:text-primary transition">Models</a>
      <a href="gallery.html" class="hover:text-primary transition">Gallery</a>
      <a href="pricing.html" class="hover:text-primary transition">Pricing</a>
      <a href="sign-in.html" class="px-4 py-2 rounded-lg bg-primary text-white hover:bg-secondary transition">Sign In</a>
    </div>
    <button id="menu-toggle" class="md:hidden w-6 h-6 text-text-secondary hover:text-primary transition">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12h18M3 6h18M3 18h18"/>
      </svg>
    </button>
  </nav>

  <main class="max-w-2xl mx-auto px-6 py-20">
    <h1 class="text-3xl font-bold mb-6 text-center">Sign In to AI Studio</h1>
    <div class="flex flex-col md:flex-row gap-8 items-center">
      <img src="https://picsum.photos/seed/sign-in/800/400" alt="Sign In illustration" class="w-full md:w-1/2 rounded-lg shadow-lg">
      <form class="flex-1 w-full space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium mb-1">Email address</label>
          <input type="email" id="email" placeholder="you@example.com" class="w-full px-4 py-2 rounded-lg bg-background border border-border focus:ring-2 focus:ring-primary focus:outline-none">
        </div>
        <div>
          <label for="password" class="block text-sm font-medium mb-1">Password</label>
          <input type="password" id="password" placeholder="••••••••" class="w-full px-4 py-2 rounded-lg bg-background border border-border focus:ring-2 focus:ring-primary focus:outline-none">
        </div>
        <div class="flex items-center justify-between">
          <label class="inline-flex items-center">
            <input type="checkbox" class="form-checkbox text-primary">
            <span class="ml-2 text-sm">Remember me</span>
          </label>
          <a href="#" class="text-sm text-primary hover:underline">Forgot password?</a>
        </div>
        <button type="submit" class="w-full px-6 py-3 rounded-lg bg-primary text-white font-medium hover:bg-secondary transition">Sign In</button>
        <div class="text-center text-sm text-text-secondary">
          Don't have an account? <a href="#" class="text-primary hover:underline">Sign Up</a>
        </div>
      </form>
    </div>
  </main>

  <footer class="px-6 py-8 mt-20 border-t border-border text-sm text-text-secondary">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
      <span>© 2024 AI Studio</span>
      <div class="flex items-center gap-6">
        <a href="#" class="hover:text-primary transition">Privacy</a>
        <a href="#" class="hover:text-primary transition">Terms</a>
        <div class="flex items-center gap-4 ml-4">
          <svg class="w-5 h-5 hover:text-primary transition cursor-pointer" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"/>
          </svg>
          <svg class="w-5 h-5 hover:text-primary transition cursor-pointer" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
          </svg>
        </div>
      </div>
    </div>
  </footer>

  <script>
    // Mobile menu toggle (optional)
    const menu = document.getElementById('menu-toggle');
    const nav = document.querySelector('nav .hidden');
    menu?.addEventListener('click', () => nav.classList.toggle('hidden'));
  </script>
</body>
</html>
