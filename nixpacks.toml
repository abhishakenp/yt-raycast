# nodejs_22 (ABI 127) is required: isolated-vm (via @tanstack/ai-isolate-node)
# ships prebuilt binaries only for abi127/abi137. Node 20 (abi115) has no
# prebuild, so node-gyp-build falls back to `node-gyp rebuild`, which isn't
# present in the nixpacks image -> build fails. Node 22 loads the shipped
# linux-x64 glibc prebuild with zero compilation.
[phases.setup]
nixPkgs = ["nodejs_22", "bun"]

[variables]
# Keep Playwright's Chromium inside node_modules so the browser binary built by
# Nixpacks is present when the Nitro server starts on the VPS.
PLAYWRIGHT_BROWSERS_PATH = "0"

[phases.install]
cmds = [
  "bun install --no-save",
  "bunx playwright install --with-deps chromium",
]

[phases.build]
# 1. Build the frontend. 2. Deploy Convex functions to the self-hosted backend
# so the deployed app and its backend functions can never drift out of sync.
# deploy:convex skips cleanly when CONVEX_SELF_HOSTED_ADMIN_KEY is absent and
# fails the build if the Convex deploy fails (fail loud, never skew).
cmds = [
  "NODE_ENV=production bun run build",
  "bun run deploy:convex",
]

# Run under node, not bun: the nitro preset is `nodeServer` (see vite.config.ts)
# and isolated-vm is a native V8 addon. Bun uses JavaScriptCore, so requiring
# isolated-vm under bun fails with ERR_DLOPEN_FAILED (missing v8:: symbols),
# crashing inline-edit code-mode at runtime. node loads the V8 prebuild fine.
[start]
cmd = "NODE_ENV=production node .output/server/index.mjs"
