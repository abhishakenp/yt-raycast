name: Gandalf Review

on:
  pull_request:
    branches: [master, develop]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trigger-gandalf-review:
    name: Trigger Gandalf Review
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5

    steps:
      - name: Trigger Gandalf Review
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO_FULL_NAME="${{ github.repository }}"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"

          echo "Triggering Gandalf review for PR #${PR_NUMBER}"

          # Call the ship-fast-agent API endpoint
          curl -X POST https://agent.ship-fast.ai/api/trigger-review \
            -H "Authorization: Bearer ${{ secrets.SHIP_FAST_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"repo_full_name\": \"${REPO_FULL_NAME}\",
              \"pr_number\": ${PR_NUMBER},
              \"default_branch\": \"${DEFAULT_BRANCH}\",
              \"branch_name\": \"${BRANCH_NAME}\"
            }"
