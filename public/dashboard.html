<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ship Fast — Dashboard</title>
    <meta name="description" content="Live generation dashboard — watch your website being built in real-time by AI." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Plausible Analytics (proxied) -->
    <script defer data-domain="ship-fast.devliv.io" data-api="/api/event" src="/js/script.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap');
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #000;
        overflow: hidden;
        font-family: 'Inter', system-ui, sans-serif;
        color: #e2e0f0;
        display: flex;
        height: 100vh;
        transition: background 1.8s cubic-bezier(0.4, 0, 0.2, 1);
      }
      body.dashboard-active {
        background: #09080f;
      }

      /* ─── Intro Overlay ─── */
      .intro-overlay {
        position: fixed;
        inset: 0;
        z-index: 200;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition:
          opacity 1s ease,
          transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .intro-overlay.exiting {
        opacity: 0;
        transform: translateY(-6vh);
        pointer-events: none;
      }
      .intro-overlay.hidden {
        display: none;
      }

      .intro-logo {
        display: flex;
        align-items: center;
        gap: 16px;
        transform: scale(2.8);
        opacity: 0;
        transition:
          transform 1.4s cubic-bezier(0.25, 0.46, 0.45, 0.94),
          opacity 0.8s ease,
          margin-top 1.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }
      .intro-logo.visible {
        opacity: 1;
        transform: scale(2.8);
      }
      .intro-logo.shaking {
        animation: rocketShake 0.08s ease-in-out infinite alternate;
      }
      .intro-logo.settled {
        transform: scale(1.1);
        margin-top: -10vh;
        animation:
          rocketLaunch 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards,
          rocketGlow 1.2s ease-out forwards;
      }
      @keyframes rocketShake {
        0% {
          transform: scale(2.8) translate(-2px, 1px) rotate(-0.5deg);
        }
        25% {
          transform: scale(2.8) translate(2px, -1px) rotate(0.5deg);
        }
        50% {
          transform: scale(2.8) translate(-1px, -2px) rotate(-0.3deg);
        }
        75% {
          transform: scale(2.8) translate(1px, 2px) rotate(0.3deg);
        }
        100% {
          transform: scale(2.8) translate(2px, -1px) rotate(0.5deg);
        }
      }
      @keyframes rocketLaunch {
        0% {
          transform: scale(2.8);
          filter: brightness(1);
        }
        30% {
          transform: scale(3);
          filter: brightness(1.8);
        }
        60% {
          transform: scale(1.2);
          filter: brightness(1.2);
        }
        100% {
          transform: scale(1.1);
          filter: brightness(1);
        }
      }
      @keyframes rocketGlow {
        0% {
          filter: drop-shadow(0 0 40px rgba(124, 58, 237, 0.8))
            drop-shadow(0 0 80px rgba(167, 139, 250, 0.4));
        }
        50% {
          filter: drop-shadow(0 0 60px rgba(124, 58, 237, 0.6))
            drop-shadow(0 0 120px rgba(167, 139, 250, 0.3));
        }
        100% {
          filter: drop-shadow(0 0 30px rgba(124, 58, 237, 0.2));
        }
      }

      .logo-icon {
        width: 52px;
        height: 52px;
        position: relative;
      }
      .logo-icon svg {
        width: 100%;
        height: 100%;
      }

      .logo-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 64px;
        font-weight: 700;
        letter-spacing: 6px;
        background: linear-gradient(135deg, #7c3aed 0%, #a78bfa 40%, #c4b5fd 60%, #7c3aed 100%);
        background-size: 200% 200%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: gradientShift 3s ease infinite;
        filter: drop-shadow(0 0 30px rgba(124, 58, 237, 0.4));
      }
      @keyframes gradientShift {
        0%,
        100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
      }

      .logo-glow {
        position: absolute;
        inset: -40px;
        background: radial-gradient(circle, rgba(124, 58, 237, 0.15) 0%, transparent 70%);
        border-radius: 50%;
        pointer-events: none;
        animation: glowPulse 2.5s ease-in-out infinite;
      }
      @keyframes glowPulse {
        0%,
        100% {
          opacity: 0.6;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.15);
        }
      }

      .intro-typing {
        margin-top: 36px;
        max-width: 800px;
        width: 90%;
        text-align: center;
        opacity: 0;
        transition: opacity 0.6s ease;
      }
      .intro-typing.visible {
        opacity: 1;
      }

      .typing-text {
        font-family: 'Inter', sans-serif;
        font-size: 36px;
        line-height: 1.4;
        color: rgba(226, 224, 240, 0.85);
        font-weight: 500;
        letter-spacing: 0.3px;
      }
      .typing-cursor {
        display: inline-block;
        width: 2px;
        height: 1.2em;
        background: #7c3aed;
        vertical-align: text-bottom;
        margin-left: 2px;
        animation: cursorBlink 0.8s step-end infinite;
      }
      @keyframes cursorBlink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }

      .intro-phase-label {
        position: absolute;
        bottom: 32px;
        left: 50%;
        transform: translateX(-50%);
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        color: rgba(167, 139, 250, 0.7);
        letter-spacing: 1.5px;
        text-transform: uppercase;
        opacity: 0;
        transition:
          opacity 0.5s ease,
          bottom 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94),
          font-size 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94),
          color 1.2s ease;
      }
      .intro-phase-label.visible {
        opacity: 1;
      }
      .intro-phase-label.switching {
        animation: statusSwitch 0.4s ease;
      }
      @keyframes statusSwitch {
        0% {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
        40% {
          opacity: 0;
          transform: translateX(-50%) translateY(-8px);
        }
        60% {
          opacity: 0;
          transform: translateX(-50%) translateY(8px);
        }
        100% {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
      }

      /* Post-typing: logo+prompt slide up and shrink, status grows */
      .intro-logo.post-typing {
        transform: scale(0.5);
        margin-top: -60vh;
        opacity: 0.3;
        transition:
          transform 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94),
          margin-top 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94),
          opacity 1.2s ease;
      }
      .intro-typing.post-typing {
        opacity: 0.8;
        transition: opacity 1.2s ease;
      }
      .intro-typing.post-typing .typing-text {
        font-size: 14px;
      }
      .intro-phase-label.post-typing {
        bottom: 45vh;
        font-size: 22px;
        color: rgba(167, 139, 250, 0.9);
        letter-spacing: 2.5px;
      }

      /* ─── Dashboard Container (hidden during intro) ─── */
      .dashboard-wrap {
        display: flex;
        width: 100%;
        height: 100%;
        opacity: 0;
        transition: opacity 0.8s ease 0.4s;
        pointer-events: none;
      }
      .dashboard-wrap.active {
        opacity: 1;
        pointer-events: auto;
      }

      /* ─── Left Panel: Tasks ─── */
      .left-panel {
        display: flex;
        flex-direction: column;
        background: #0f0d1a;
        border-right: 1px solid #2d2a3e;
        transition:
          width 1s cubic-bezier(0.4, 0, 0.2, 1),
          min-width 1s cubic-bezier(0.4, 0, 0.2, 1),
          opacity 0.6s ease;
        overflow: hidden;
        position: relative;
        width: 100%;
        min-width: 280px;
      }
      .left-panel.drawer-open {
        width: 45%;
        min-width: 280px;
      }
      .left-panel.collapsed {
        width: 0;
        min-width: 0;
        opacity: 0;
        border-right: none;
      }

      .panel-header {
        padding: 16px 20px 12px;
        border-bottom: 1px solid #2d2a3e;
        flex-shrink: 0;
      }
      .panel-header h1 {
        font-family: 'JetBrains Mono', monospace;
        font-size: 16px;
        font-weight: 700;
        color: #7c3aed;
        letter-spacing: 1px;
      }
      .panel-header .subtitle {
        font-size: 11px;
        color: #8b86a8;
        margin-top: 2px;
      }

      .stats-bar {
        display: flex;
        gap: 16px;
        padding: 10px 20px;
        border-bottom: 1px solid #2d2a3e;
        font-size: 11px;
        color: #8b86a8;
        flex-shrink: 0;
      }
      .stats-bar b {
        color: #e2e0f0;
        font-weight: 600;
      }

      /* ─── Task List ─── */
      .task-list {
        flex: 1;
        overflow-y: auto;
        padding: 8px 12px;
        scrollbar-width: thin;
        scrollbar-color: #2d2a3e transparent;
        position: relative;
      }
      .task-planning-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 40px 20px;
      }
      .task-planning-loader .pulse-ring {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 2px solid rgba(124, 58, 237, 0.15);
        border-top-color: #7c3aed;
        animation: spin 1s linear infinite;
      }
      .task-planning-loader .pulse-dots {
        display: flex;
        gap: 6px;
      }
      .task-planning-loader .pulse-dots span {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #7c3aed;
        animation: pulseDot 1.2s ease-in-out infinite;
      }
      .task-planning-loader .pulse-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .task-planning-loader .pulse-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes pulseDot {
        0%,
        80%,
        100% {
          opacity: 0.2;
          transform: scale(0.8);
        }
        40% {
          opacity: 1;
          transform: scale(1.2);
        }
      }
      .task-planning-loader p {
        font-size: 11px;
        color: #6b6880;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .task-list::-webkit-scrollbar {
        width: 4px;
      }
      .task-list::-webkit-scrollbar-track {
        background: transparent;
      }
      .task-list::-webkit-scrollbar-thumb {
        background: #2d2a3e;
        border-radius: 2px;
      }

      .task-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        margin: 4px 0;
        background: #1a1726;
        border: 1px solid #2d2a3e;
        border-radius: 10px;
        transition: all 0.3s ease;
        animation: taskSlideIn 0.4s ease-out backwards;
      }
      .task-item:hover {
        border-color: rgba(124, 58, 237, 0.3);
      }
      .task-item.running {
        border-color: rgba(124, 58, 237, 0.4);
        background: linear-gradient(135deg, #1a1726 0%, rgba(124, 58, 237, 0.08) 100%);
      }
      .task-item.done {
        border-color: rgba(0, 230, 118, 0.2);
        opacity: 0.7;
      }
      .task-item.failed {
        border-color: rgba(248, 81, 73, 0.3);
      }
      .task-item.teleporting {
        animation: taskTeleport 0.6s ease-in forwards;
      }

      @keyframes taskSlideIn {
        from {
          opacity: 0;
          transform: translateX(-20px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      @keyframes taskTeleport {
        0% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.8;
          transform: scale(1.05);
          filter: brightness(2);
        }
        100% {
          opacity: 0;
          transform: scale(0.3);
          filter: brightness(3);
        }
      }

      .agent-avatar {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 700;
        flex-shrink: 0;
        position: relative;
      }
      .agent-avatar canvas {
        width: 32px;
        height: 32px;
        border-radius: 6px;
      }
      .agent-avatar .spinner {
        position: absolute;
        inset: -3px;
        border: 2px solid transparent;
        border-top-color: #7c3aed;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .task-info {
        flex: 1;
        min-width: 0;
      }
      .task-title {
        font-size: 12px;
        font-weight: 600;
        color: #e2e0f0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .task-files {
        font-size: 10px;
        color: #8b86a8;
        margin-top: 2px;
        font-family: 'JetBrains Mono', monospace;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .status-badge {
        padding: 3px 8px;
        border-radius: 6px;
        font-size: 9px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        flex-shrink: 0;
        font-family: 'JetBrains Mono', monospace;
      }
      .status-badge.pending {
        background: #252233;
        color: #8b86a8;
      }
      .status-badge.running {
        background: rgba(124, 58, 237, 0.2);
        color: #a78bfa;
      }
      .status-badge.done {
        background: rgba(0, 230, 118, 0.15);
        color: #69f0ae;
      }
      .status-badge.failed {
        background: rgba(248, 81, 73, 0.15);
        color: #ff5252;
      }

      /* ─── Progress Bar (frontend) ─── */
      .progress-section {
        padding: 12px 20px;
        border-top: 1px solid #2d2a3e;
        flex-shrink: 0;
      }
      .progress-label {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: #8b86a8;
        margin-bottom: 6px;
      }
      .progress-track {
        height: 4px;
        background: #252233;
        border-radius: 2px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        width: 0%;
        border-radius: 2px;
        background: linear-gradient(90deg, #7c3aed, #a78bfa);
        transition: width 0.5s ease;
      }
      .progress-fill.has-failures {
        background: linear-gradient(90deg, #7c3aed, #ff5252);
      }

      /* ─── Log Panel ─── */
      .log-section {
        border-top: 1px solid #2d2a3e;
        flex-shrink: 0;
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease;
      }
      .log-section.open {
        max-height: 160px;
      }
      .log-toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 20px;
        cursor: pointer;
        font-size: 10px;
        color: #8b86a8;
        border: none;
        background: none;
        width: 100%;
        text-align: left;
        font-family: 'JetBrains Mono', monospace;
      }
      .log-toggle:hover {
        color: #e2e0f0;
      }
      .log-toggle .arrow {
        transition: transform 0.3s;
      }
      .log-section.open .log-toggle .arrow {
        transform: rotate(90deg);
      }
      .log-content {
        max-height: 120px;
        overflow-y: auto;
        padding: 0 16px 8px;
        scrollbar-width: thin;
        scrollbar-color: #2d2a3e transparent;
      }
      .log-line {
        font-family: 'JetBrains Mono', monospace;
        font-size: 9px;
        padding: 1px 0;
        color: #8b86a8;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .log-line.err {
        color: #ff5252;
      }
      .log-line.ok {
        color: #69f0ae;
      }
      .log-line.info {
        color: #7c3aed;
      }

      /* ─── Right Panel: Browser Preview Drawer ─── */
      .right-panel {
        width: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        padding: 0;
        transition:
          width 1s cubic-bezier(0.4, 0, 0.2, 1),
          padding 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
      }
      .right-panel.open {
        padding: 12px 16px 16px 8px;
      }
      .right-panel.expanded {
        width: 100%;
        padding: 12px 16px 16px 16px;
      }

      .browser-chrome {
        display: flex;
        flex-direction: column;
        background: #1a1726;
        border: 1px solid #2d2a3e;
        border-radius: 12px;
        overflow: hidden;
        flex: 1;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        min-width: 0;
      }

      .browser-toolbar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        background: #0f0d1a;
        border-bottom: 1px solid #2d2a3e;
      }
      .browser-dots {
        display: flex;
        gap: 4px;
        flex-shrink: 0;
      }
      .browser-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .browser-dots span:nth-child(1) {
        background: #ff5f57;
        cursor: pointer;
        transition:
          transform 0.15s,
          box-shadow 0.15s;
      }
      .browser-dots span:nth-child(1):hover {
        transform: scale(1.3);
        box-shadow: 0 0 8px rgba(255, 95, 87, 0.5);
      }
      .browser-dots span:nth-child(2) {
        background: #febc2e;
      }
      .browser-dots span:nth-child(3) {
        background: #28c840;
      }

      .browser-url {
        flex: 1;
        padding: 5px 10px;
        background: #252233;
        border: 1px solid #2d2a3e;
        border-radius: 4px;
        font-size: 11px;
        color: #8b86a8;
        font-family: 'JetBrains Mono', monospace;
        display: flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
      }
      .browser-url .lock {
        color: #69f0ae;
        font-size: 10px;
      }
      .browser-url .url-text {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .browser-status {
        font-size: 9px;
        color: #8b86a8;
        padding: 0 6px;
        font-family: 'JetBrains Mono', monospace;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 4px;
        white-space: nowrap;
      }
      .browser-status .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #69f0ae;
        animation: pulse 2s ease infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }

      .browser-content {
        flex: 1;
        position: relative;
        background: #09080f;
      }
      .browser-content iframe {
        width: 100%;
        height: 100%;
        border: none;
        background: #09080f;
      }

      /* ─── Preview Loading Bar ─── */
      .preview-loading {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        z-index: 10;
        background: rgba(37, 34, 51, 0.6);
        overflow: hidden;
        transition: opacity 0.6s ease;
        pointer-events: none;
      }
      .preview-loading.hidden {
        opacity: 0;
      }

      .preview-progress {
        width: 100%;
        height: 100%;
      }
      .preview-progress-fill {
        height: 100%;
        width: 0%;
        border-radius: 0 2px 2px 0;
        background: linear-gradient(90deg, #7c3aed, #a78bfa);
        box-shadow:
          0 0 8px rgba(124, 58, 237, 0.4),
          0 0 16px rgba(124, 58, 237, 0.2);
        transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .preview-loading:not(.determinate) .preview-progress-fill {
        width: 30%;
        animation: indeterminateShimmer 1.5s ease-in-out infinite;
      }
      @keyframes indeterminateShimmer {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(400%);
        }
      }
      .preview-loading.determinate .preview-progress-fill {
        animation: none;
        transform: none;
      }

      /* ─── Backend Progress Bar ─── */
      .backend-progress {
        position: absolute;
        bottom: 16px;
        left: 8px;
        right: 16px;
        height: 3px;
        border-radius: 2px;
        background: rgba(37, 34, 51, 0.6);
        overflow: hidden;
        opacity: 0;
        transition: opacity 0.8s ease;
        z-index: 10;
      }
      .backend-progress.visible {
        opacity: 1;
      }
      .backend-progress-fill {
        height: 100%;
        width: 0%;
        border-radius: 2px;
        background: linear-gradient(90deg, rgba(124, 58, 237, 0.6), rgba(167, 139, 250, 0.4));
        box-shadow:
          0 0 8px rgba(124, 58, 237, 0.3),
          0 0 16px rgba(124, 58, 237, 0.15);
        transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
      }
      .backend-progress-fill::after {
        content: '';
        position: absolute;
        right: 0;
        top: -2px;
        bottom: -2px;
        width: 20px;
        background: radial-gradient(ellipse at right, rgba(167, 139, 250, 0.5), transparent);
        border-radius: 0 2px 2px 0;
        animation: glowTrail 1.5s ease-in-out infinite;
      }
      @keyframes glowTrail {
        0%,
        100% {
          opacity: 0.4;
        }
        50% {
          opacity: 1;
        }
      }

      /* ─── Completion overlay ─── */
      .completion-banner {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        padding: 12px 24px;
        background: linear-gradient(135deg, rgba(124, 58, 237, 0.9), rgba(167, 139, 250, 0.9));
        color: #fff;
        text-align: center;
        font-weight: 600;
        font-size: 14px;
        transform: translateY(-100%);
        transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 300;
        backdrop-filter: blur(8px);
      }
      .completion-banner.visible {
        transform: translateY(0);
      }

      /* ─── Split toggle button ─── */
      #split-toggle-btn {
        margin-left: 4px;
        padding: 2px 6px;
        font-size: 8px;
        font-family: monospace;
        background: #1e1a2e;
        border: 1px solid #3d3a5e;
        color: #a09cc0;
        border-radius: 3px;
        cursor: pointer;
        letter-spacing: 0.05em;
        transition:
          background 0.15s,
          color 0.15s,
          transform 0.15s;
      }

      /* ─── Generate Design Button ─── */
      #generate-design-btn {
        margin-left: 4px;
        padding: 2px 6px;
        font-size: 8px;
        background: #1e3a2e;
        border: 1px solid #10b981;
        color: #a7f3d0;
        border-radius: 3px;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 2px;
        white-space: nowrap;
        height: auto;
        font-family: 'JetBrains Mono', monospace;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      #generate-design-btn:hover {
        background: #10b981;
        color: #000;
      }
      #generate-design-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* ─── Magic Theme Button ─── */
      #theme-magic-btn {
        margin-left: 4px;
        padding: 2px 6px;
        font-size: 8px;
        background: #2e1a4e;
        border: 1px solid #7c3aed;
        color: #c4b5fd;
        border-radius: 3px;
        cursor: pointer;
        transition: all 0.2s;
        display: none;
        align-items: center;
        gap: 2px;
        white-space: nowrap;
        height: auto;
        font-family: 'JetBrains Mono', monospace;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      #theme-magic-btn.ready {
        display: flex;
      }
      #theme-magic-btn:hover {
        background: #7c3aed;
        color: #fff;
        transform: scale(1.05);
        box-shadow: 0 0 12px rgba(124, 58, 237, 0.4);
      }
      #theme-magic-btn.ready {
        display: flex;
        animation: buttonGlow 2s infinite;
      }
      @keyframes buttonGlow {
        0%,
        100% {
          box-shadow: 0 0 5px rgba(124, 58, 237, 0.4);
        }
        50% {
          box-shadow: 0 0 15px rgba(124, 58, 237, 0.7);
        }
      }

      /* ─── Debug burger + panel (debug mode only) ─── */
      .debug-burger {
        display: none;
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 400;
        width: 36px;
        height: 36px;
        border: none;
        border-radius: 8px;
        background: rgba(37, 34, 51, 0.7);
        backdrop-filter: blur(8px);
        cursor: pointer;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        transition: background 0.2s;
      }
      .debug-burger:hover {
        background: rgba(124, 58, 237, 0.3);
      }
      .debug-burger span {
        display: block;
        width: 16px;
        height: 2px;
        background: #8b86a8;
        border-radius: 1px;
        transition:
          transform 0.3s,
          opacity 0.2s;
      }
      .debug-burger.open span:nth-child(1) {
        transform: rotate(45deg) translate(3px, 3px);
      }
      .debug-burger.open span:nth-child(2) {
        opacity: 0;
      }
      .debug-burger.open span:nth-child(3) {
        transform: rotate(-45deg) translate(3px, -3px);
      }
      body.debug-mode .debug-burger {
        display: flex;
      }

      .debug-panel {
        display: none;
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: 380px;
        z-index: 350;
        background: rgba(15, 13, 26, 0.95);
        backdrop-filter: blur(12px);
        border-left: 1px solid #2d2a3e;
        transform: translateX(100%);
        transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        flex-direction: column;
      }
      body.debug-mode .debug-panel {
        display: flex;
      }
      .debug-panel.open {
        transform: translateX(0);
      }

      .debug-panel-header {
        padding: 16px 20px 12px;
        border-bottom: 1px solid #2d2a3e;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .debug-panel-header h2 {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        font-weight: 700;
        color: #7c3aed;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      .debug-panel-header .event-count {
        font-size: 10px;
        color: #8b86a8;
        font-family: 'JetBrains Mono', monospace;
      }

      .debug-feed {
        flex: 1;
        overflow-y: auto;
        padding: 8px 12px;
        scrollbar-width: thin;
        scrollbar-color: #2d2a3e transparent;
      }
      .debug-feed::-webkit-scrollbar {
        width: 4px;
      }
      .debug-feed::-webkit-scrollbar-track {
        background: transparent;
      }
      .debug-feed::-webkit-scrollbar-thumb {
        background: #2d2a3e;
        border-radius: 2px;
      }

      .debug-event {
        padding: 8px 10px;
        margin: 4px 0;
        background: #1a1726;
        border: 1px solid #2d2a3e;
        border-radius: 8px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        animation: taskSlideIn 0.3s ease-out;
      }
      .debug-event .ev-type {
        color: #a78bfa;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 9px;
        letter-spacing: 0.5px;
      }
      .debug-event .ev-time {
        color: #555;
        font-size: 9px;
        float: right;
      }
      .debug-event .ev-body {
        color: #8b86a8;
        margin-top: 4px;
        word-break: break-all;
        white-space: pre-wrap;
        line-height: 1.4;
      }
      .debug-event.ev-error {
        border-color: rgba(248, 81, 73, 0.3);
      }
      .debug-event.ev-error .ev-type {
        color: #ff5252;
      }
      .debug-event.ev-success {
        border-color: rgba(0, 230, 118, 0.2);
      }
      .debug-event.ev-success .ev-type {
        color: #69f0ae;
      }

      /* ─── Particles canvas ─── */
      .particles-canvas {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 250;
      }
    </style>
  </head>
  <body>
    <!-- ─── Audio: Rocket launch SFX ─── -->
    <audio id="launch-sfx" preload="auto" src="/assets/launch.mp3"></audio>

    <!-- ─── Intro Overlay ─── -->
    <div class="intro-overlay" id="intro-overlay">
      <div class="logo-glow"></div>
      <div class="intro-logo" id="intro-logo">
        <div class="logo-icon">
          <svg viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M26 4L8 20L14 22L26 10L38 22L44 20L26 4Z" fill="url(#g1)" opacity="0.9" />
            <path d="M14 22L14 40L22 36V24L14 22Z" fill="url(#g2)" opacity="0.8" />
            <path d="M38 22L38 40L30 36V24L38 22Z" fill="url(#g2)" opacity="0.8" />
            <path d="M22 24V36L26 38L30 36V24L26 20L22 24Z" fill="url(#g1)" />
            <path d="M22 38L26 48L30 38L26 40L22 38Z" fill="#a78bfa" opacity="0.7" />
            <circle cx="26" cy="16" r="2" fill="#c4b5fd" />
            <defs>
              <linearGradient id="g1" x1="8" y1="4" x2="44" y2="48" gradientUnits="userSpaceOnUse">
                <stop stop-color="#7c3aed" />
                <stop offset="1" stop-color="#a78bfa" />
              </linearGradient>
              <linearGradient
                id="g2"
                x1="14"
                y1="22"
                x2="38"
                y2="40"
                gradientUnits="userSpaceOnUse"
              >
                <stop stop-color="#6d28d9" />

            </defs>
          </svg>
        </div>
        <span class="logo-text">SHIP</span>

      <div class="intro-typing" id="intro-typing">
        <span class="typing-text" id="typing-text"></span
        ><span class="typing-cursor" id="typing-cursor"></span>
      </div>

      <div class="intro-phase-label" id="intro-phase-label">preparing</div>
    </div>

    <!-- ─── Dashboard ─── -->
    <div class="dashboard-wrap" id="dashboard-wrap">
      <div class="left-panel" id="left-panel">
        <div class="panel-header">
          <h1>SHIP</h1>
          <div class="subtitle" id="phase-text">Initializing...</div>
        </div>

        <div class="stats-bar">
          <span id="gen-timing">Waiting…</span>
        </div>

        <div class="task-list" id="task-list">
          <div class="task-planning-loader" id="task-planning-loader">
            <div class="pulse-ring"></div>
            <p>Planning tasks…</p>
            <div class="pulse-dots"><span></span><span></span><span></span></div>
          </div>
        </div>

        <div class="progress-section">
          <div class="progress-label">
            <span>Progress</span>
            <span id="progress-pct">0%</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>

        <div class="log-section" id="log-section">
          <button class="log-toggle" id="log-toggle">
            <span class="arrow">&#9654;</span> LOGS
          </button>
          <div class="log-content" id="log-content"></div>
        </div>
      </div>

      <div class="right-panel" id="right-panel">
        <div class="browser-chrome">
          <div class="browser-toolbar">
            <div class="browser-dots">
              <span onclick="location.href = '/'"></span><span></span><span></span>
            </div>
            <div class="browser-url">
              <span class="lock">&#9679;</span>
              <span class="url-text" id="url-text">localhost:3001</span>
            </div>
            <div class="browser-status">
              <span class="dot" id="status-dot"></span>
              <span id="status-text">Preview</span>
              <!-- generate/theme buttons hidden for now -->
              <!--
              <button id="generate-design-btn" onclick="generateAlternativeDesign()" title="Generate Alternative Theme">🎨 GENERATE</button>
              <button id="theme-magic-btn" onclick="applyMagicTheme()" title="Magic: Switch Theme">✨ MAGIC THEME</button>
              -->
            </div>
            <button
              id="split-toggle-btn"
              onclick="toggleSplit()"
              title="Toggle 50/50 split"
              style="display: none"
            >
              ⬛ 50/50
            </button>
          </div>
          <div class="browser-content">
            <iframe id="preview-iframe" src="about:blank"></iframe>
            <div class="preview-loading" id="preview-loading">
              <div class="preview-progress">
                <div class="preview-progress-fill" id="preview-progress-fill"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="backend-progress" id="backend-progress">
          <div class="backend-progress-fill" id="backend-progress-fill"></div>
        </div>
      </div>
    </div>

    <div class="completion-banner" id="completion-banner">All tasks completed — app is live!</div>

    <canvas class="particles-canvas" id="particles-canvas"></canvas>

    <!-- ─── Debug Panel (visible only in debug mode: ?debug=1) ─── -->
    <button class="debug-burger" id="debug-burger"><span></span><span></span><span></span></button>
    <div class="debug-panel" id="debug-panel">
      <div class="debug-panel-header">
        <h2>Live Events</h2>
        <span class="event-count" id="debug-event-count">0 events</span>
      </div>
      <div class="debug-feed" id="debug-feed"></div>
    </div>

    <script>
      // ─── Config ────────────────────────────────────────────────
      const SESSION_ID = location.pathname.split('/session/')[1]?.split('/')[0] ?? ''
      const PREVIEW_BASE = `${location.origin}/preview/${SESSION_ID}`
      const WS_URL = `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}?session=${SESSION_ID}`
      const TYPING_SPEED_MS = 40

      // ─── Audio unlock: ensure launch SFX can play ──────────────
      const launchSfx = document.getElementById('launch-sfx')
      let audioUnlocked = false
      function unlockAudio() {
        if (audioUnlocked) return
        audioUnlocked = true
        if (launchSfx) {
          launchSfx
            .play()
            .then(() => {
              launchSfx.pause()
              launchSfx.currentTime = 0
            })
            .catch(() => {})
        }
      }
      // Try unlock on any user gesture (click from previous page won't carry)
      document.addEventListener('click', unlockAudio, { once: true })
      document.addEventListener('touchstart', unlockAudio, { once: true })
      document.addEventListener('keydown', unlockAudio, { once: true })
      // Also try immediately — works if browser allows autoplay
      if (launchSfx) {
        launchSfx
          .play()
          .then(() => {
            audioUnlocked = true
            launchSfx.pause()
            launchSfx.currentTime = 0
          })
          .catch(() => {})
      }

      // ─── Debug mode (?debug=1) ─────────────────────────────────
      const DEBUG_MODE = new URLSearchParams(location.search).has('debug')
      let debugEventCount = 0

      if (DEBUG_MODE) {
        document.body.classList.add('debug-mode')
        document.getElementById('debug-burger').addEventListener('click', () => {
          document.getElementById('debug-burger').classList.toggle('open')
          document.getElementById('debug-panel').classList.toggle('open')
        })
      }

      function debugLog(type, data) {
        if (!DEBUG_MODE) return
        debugEventCount++
        const feed = document.getElementById('debug-feed')
        const countEl = document.getElementById('debug-event-count')
        countEl.textContent = debugEventCount + ' event' + (debugEventCount !== 1 ? 's' : '')

        const el = document.createElement('div')
        let cls = 'debug-event'
        if (/fail|error|exception/i.test(type)) cls += ' ev-error'
        else if (/done|complete|ok/i.test(type)) cls += ' ev-success'
        el.className = cls

        const now = new Date()
        const ts =
          now.toLocaleTimeString('en-GB', { hour12: false }) +
          '.' +
          String(now.getMilliseconds()).padStart(3, '0')

        let body = ''
        if (typeof data === 'string') body = data
        else if (data) body = JSON.stringify(data, null, 2)

        el.innerHTML =
          '<span class="ev-type">' +
          type +
          '</span><span class="ev-time">' +
          ts +
          '</span>' +
          (body ? '<div class="ev-body">' + body.replace(/</g, '&lt;') + '</div>' : '')

        feed.appendChild(el)
        feed.scrollTop = feed.scrollHeight
      }

      // ─── State ─────────────────────────────────────────────────
      let tasks = []
      let genStartTime = Date.now()
      let taskMap = {}
      let allDone = false
      let drawerOpen = false
      let previewLoaded = false
      let wsConnected = false
      let introActive = true
      let introPromptText = ''
      let typingDone = false
      let pendingStatus = ''
      let hasSeenLiveUpdate = false // only auto-collapse if we watched tasks complete live
      let isReconnect = false // true when refreshing a session that already has homepage
      let alternativeDesign = null // background-loaded alternative theme

      // ─── Magic Theme Logic ─────────────────────────────────────
      function applyMagicTheme() {
        if (!alternativeDesign) return
        const iframe = document.getElementById('preview-iframe')
        if (iframe && iframe.contentWindow) {
          iframe.contentWindow.postMessage({ type: 'UPDATE_THEME', colors: alternativeDesign }, '*')

          // Visual feedback on button
          const btn = document.getElementById('theme-magic-btn')
          btn.style.transform = 'scale(1.1) rotate(5deg)'
          setTimeout(() => (btn.style.transform = ''), 200)
        }
      }

      function generateAlternativeDesign() {
        const btn = document.getElementById('generate-design-btn')
        btn.disabled = true
        btn.textContent = '⏳ GENERATING...'

        fetch(`/api/sessions/${SESSION_ID}/generate-design`, { method: 'POST' })
          .then((res) => res.json())
          .then((data) => {
            btn.textContent = '🎨 GENERATE'
            btn.disabled = false
          })
          .catch((err) => {
            console.error('Design generation error:', err)
            btn.textContent = '🎨 GENERATE'
            btn.disabled = false
          })
      }

      // ─── Task classification ───────────────────────────────────
      function isFrontendTask(task) {
        const files = task.files || []
        return files.some((f) => f.endsWith('.html'))
      }

      function getTaskCounts() {
        const frontend = tasks.filter(isFrontendTask)
        const backend = tasks.filter((t) => !isFrontendTask(t))
        const frontendDone = frontend.filter(
          (t) => t.status === 'DONE' || t.status === 'FAILED',
        ).length
        const backendDone = backend.filter(
          (t) => t.status === 'DONE' || t.status === 'FAILED',
        ).length
        return {
          frontendTotal: frontend.length,
          frontendDone,
          backendTotal: backend.length,
          backendDone,
          totalDone: frontendDone + backendDone,
        }
      }

      // ─── Dev mode ───────────────────────────────────────────────
      const isDev = new URLSearchParams(window.location.search).has('dev')
      if (isDev) {
        document.getElementById('split-toggle-btn').style.display = ''
      }

      // ─── Split toggle ────────────────────────────────────────────
      let splitPinned = false

      function toggleSplit() {
        if (!drawerOpen) return
        splitPinned = !splitPinned
        const btn = document.getElementById('split-toggle-btn')
        const leftPanel = document.getElementById('left-panel')
        const rightPanel = document.getElementById('right-panel')
        if (splitPinned) {
          leftPanel.classList.remove('collapsed')
          rightPanel.classList.remove('expanded')
          rightPanel.classList.add('open')
          rightPanel.style.width = '50%'
          leftPanel.style.width = '50%'
          btn.textContent = '▣ 50/50'
          btn.style.color = '#c4b5fd'
          btn.style.borderColor = '#7c3aed'
          btn.style.background = '#2e1a4e'
        } else {
          btn.textContent = '⬛ 50/50'
          btn.style.color = '#a09cc0'
          btn.style.borderColor = '#3d3a5e'
          btn.style.background = '#1e1a2e'
          if (frontendComplete) {
            leftPanel.classList.add('collapsed')
            rightPanel.classList.remove('open')
            rightPanel.classList.add('expanded')
            rightPanel.style.width = ''
            leftPanel.style.width = ''
          } else {
            updatePreviewProgress()
          }
        }
      }

      // ─── Open the preview drawer ────────────────────────────────
      let frontendComplete = false

      function openDrawer() {
        if (drawerOpen) return
        drawerOpen = true
        const leftPanel = document.getElementById('left-panel')
        const rightPanel = document.getElementById('right-panel')
        leftPanel.classList.add('drawer-open')
        rightPanel.classList.add('open')
        rightPanel.style.width = '50%'
        leftPanel.style.width = '50%'
        loadPreview()
      }

      // ─── Update preview loading + dynamic split width ───────────
      function updatePreviewProgress() {
        if (!drawerOpen) return
        const loading = document.getElementById('preview-loading')
        const progressFill = document.getElementById('preview-progress-fill')
        const leftPanel = document.getElementById('left-panel')
        const rightPanel = document.getElementById('right-panel')

        const counts = getTaskCounts()
        if (counts.frontendTotal === 0) return

        const rawPct = (counts.frontendDone / counts.frontendTotal) * 100
        const rightWidth = Math.max(50, rawPct)
        const leftWidth = 100 - rightWidth

        if (!frontendComplete && !splitPinned) {
          rightPanel.style.width = rightWidth + '%'
          leftPanel.style.width = leftWidth + '%'
        }

        progressFill.style.width = Math.round(rawPct) + '%'

        if (counts.frontendDone > 0 && !loading.classList.contains('determinate')) {
          loading.classList.add('determinate')
        }

        if (counts.frontendDone >= counts.frontendTotal && !frontendComplete && hasSeenLiveUpdate) {
          frontendComplete = true
          loading.classList.add('hidden')
          setTimeout(() => {
            if (!splitPinned) {
              leftPanel.classList.add('collapsed')
              rightPanel.classList.remove('open')
              rightPanel.classList.add('expanded')
              rightPanel.style.width = ''
              leftPanel.style.width = ''
              reloadPreview()
            }
          }, 600)
        }
      }

      function updateBackendProgress() {
        const counts = getTaskCounts()
        const bp = document.getElementById('backend-progress')
        const bpf = document.getElementById('backend-progress-fill')
        if (counts.backendTotal > 0) {
          bp.classList.add('visible')
          const pct = Math.round((counts.backendDone / counts.backendTotal) * 100)
          bpf.style.width = pct + '%'
        } else {
          bp.classList.remove('visible')
        }
      }

      // ─── Intro Animation ───────────────────────────────────────
      function startIntro() {
        const logo = document.getElementById('intro-logo')
        const phase = document.getElementById('intro-phase-label')

        setTimeout(() => logo.classList.add('visible'), 200)

        setTimeout(() => {
          logo.classList.add('shaking')
          emitExhaustParticles()
          const sfx = document.getElementById('launch-sfx')
          if (sfx) {
            sfx.volume = 0.7
            sfx.play().catch(() => {})
          }
        }, 1000)

        setTimeout(() => {
          logo.classList.remove('shaking')
          logo.classList.add('settled')
          phase.classList.add('visible')
          emitLaunchBurst()
        }, 2000)

        setTimeout(() => {
          document.getElementById('intro-typing').classList.add('visible')
          startTyping()
        }, 3000)
      }

      function emitExhaustParticles() {
        const logo = document.getElementById('intro-logo')
        if (!logo.classList.contains('shaking')) return
        const rect = logo.getBoundingClientRect()
        const cx = rect.left + rect.width / 2
        const cy = rect.bottom
        for (let i = 0; i < 3; i++) {
          particles.push({
            x: cx + (Math.random() - 0.5) * 40,
            y: cy + Math.random() * 10,
            vx: (Math.random() - 0.5) * 60,
            vy: 80 + Math.random() * 120,
            color: ['#7c3aed', '#a78bfa', '#f97316', '#fbbf24'][Math.floor(Math.random() * 4)],
            life: 0.4 + Math.random() * 0.3,
            maxLife: 0.7,
            size: 2 + Math.random() * 3,
          })
        }
        setTimeout(emitExhaustParticles, 50)
      }

      function emitLaunchBurst() {
        const logo = document.getElementById('intro-logo')
        const rect = logo.getBoundingClientRect()
        const cx = rect.left + rect.width / 2
        const cy = rect.top + rect.height / 2
        const colors = ['#7c3aed', '#a78bfa', '#c4b5fd', '#f97316', '#fbbf24', '#fff']
        for (let i = 0; i < 40; i++) {
          const angle = Math.random() * Math.PI * 2
          const speed = 100 + Math.random() * 300
          particles.push({
            x: cx,
            y: cy,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            color: colors[Math.floor(Math.random() * colors.length)],
            life: 0.6 + Math.random() * 0.8,
            maxLife: 1.4,
            size: 2 + Math.random() * 5,
          })
        }
      }

      function startTyping() {
        if (!introPromptText) {
          setTimeout(startTyping, 200)
          return
        }
        const el = document.getElementById('typing-text')
        let i = 0
        const interval = setInterval(() => {
          if (i < introPromptText.length) {
            el.textContent += introPromptText[i]
            i++
          } else {
            clearInterval(interval)
            typingDone = true
            document.getElementById('typing-cursor').style.display = 'none'

            setTimeout(() => {
              document.getElementById('intro-logo').classList.add('post-typing')
              document.getElementById('intro-typing').classList.add('post-typing')
              document.getElementById('intro-phase-label').classList.add('post-typing')
            }, 800)
            if (pendingStatus) {
              setPhaseLabel(pendingStatus)
              pendingStatus = ''
            }
          }
        }, TYPING_SPEED_MS)
      }

      function setPhaseLabel(text) {
        const statusLabel = document.getElementById('intro-phase-label')
        if (statusLabel.classList.contains('visible') && statusLabel.textContent !== text) {
          statusLabel.classList.add('switching')
          setTimeout(() => {
            statusLabel.textContent = text
            statusLabel.classList.remove('switching')
          }, 200)
        } else {
          statusLabel.textContent = text
          statusLabel.classList.add('visible')
        }
      }

      function exitIntro() {
        if (!introActive) return
        introActive = false

        const overlay = document.getElementById('intro-overlay')
        const wrap = document.getElementById('dashboard-wrap')

        document.body.classList.add('dashboard-active')
        overlay.classList.add('exiting')
        wrap.classList.add('active')
        setTimeout(() => overlay.classList.add('hidden'), 1400)
      }

      function skipIntro() {
        introActive = false

        const overlay = document.getElementById('intro-overlay')
        const wrap = document.getElementById('dashboard-wrap')
        const leftPanel = document.getElementById('left-panel')
        const rightPanel = document.getElementById('right-panel')

        // Instantly hide intro, show dashboard
        document.body.classList.add('dashboard-active')
        overlay.classList.add('exiting', 'hidden')
        overlay.style.display = 'none'
        wrap.classList.add('active')

        // Preview full-width immediately
        drawerOpen = true
        frontendComplete = true
        leftPanel.classList.add('drawer-open', 'collapsed')
        rightPanel.classList.add('expanded')
        document.getElementById('preview-loading').classList.add('hidden')
        loadPreview()
      }

      // ─── Pixel art sprites for agent avatars ───────────────────
      const SPRITE_FRAMES = [
        [
          '................',
          '......HHHH......',
          '.....HHHHHH.....',
          '....HSSSSSH.....',
          '....SEEEESH.....',
          '....SEEEESH.....',
          '....SSMMSS......',
          '.....SSSS.......',
          '....CCCCCC......',
          '...CCCCCCCC.....',
          '...CCCCCCCC.....',
          '...CC.CC.CC.....',
          '....CCCCCC......',
          '....LL..LL......',
          '....LL..LL......',
          '...BBB..BBB.....',
        ],
      ]
      const PALETTES = [
        {
          H: '#00cec9',
          S: '#ffeaa7',
          E: '#2d3436',
          M: '#e17055',
          C: '#00b894',
          L: '#2d3436',
          B: '#636e72',
        },
        {
          H: '#fdcb6e',
          S: '#ffeaa7',
          E: '#2d3436',
          M: '#e17055',
          C: '#e17055',
          L: '#2d3436',
          B: '#636e72',
        },
        {
          H: '#74b9ff',
          S: '#ffeaa7',
          E: '#2d3436',
          M: '#e17055',
          C: '#0984e3',
          L: '#2d3436',
          B: '#636e72',
        },
        {
          H: '#ff7675',
          S: '#ffeaa7',
          E: '#2d3436',
          M: '#e17055',
          C: '#d63031',
          L: '#2d3436',
          B: '#636e72',
        },
        {
          H: '#a29bfe',
          S: '#ffeaa7',
          E: '#2d3436',
          M: '#e17055',
          C: '#6c5ce7',
          L: '#2d3436',
          B: '#636e72',
        },
        {
          H: '#55efc4',
          S: '#ffeaa7',
          E: '#2d3436',
          M: '#e17055',
          C: '#00b894',
          L: '#2d3436',
          B: '#636e72',
        },
      ]

      const spriteCache = new Map()
      function renderSprite(paletteIndex) {
        const key = 'p' + paletteIndex
        if (spriteCache.has(key)) return spriteCache.get(key)
        const palette = PALETTES[paletteIndex % PALETTES.length]
        const frame = SPRITE_FRAMES[0]
        const c = document.createElement('canvas')
        c.width = 32
        c.height = 32
        const ctx = c.getContext('2d')
        const px = 2
        for (let y = 0; y < 16; y++) {
          for (let x = 0; x < 16; x++) {
            const ch = frame[y][x]
            if (ch === '.') continue
            ctx.fillStyle = palette[ch] || '#fff'
            ctx.fillRect(x * px, y * px, px, px)
          }
        }
        spriteCache.set(key, c)
        return c
      }

      // ─── Task list rendering ───────────────────────────────────
      function renderTasks() {
        const container = document.getElementById('task-list')
        const loader = document.getElementById('task-planning-loader')
        if (loader) loader.style.display = tasks.length === 0 ? 'flex' : 'none'

        const existing = new Set()
        tasks.forEach((t) => existing.add(t.id))

        container.querySelectorAll('.task-item').forEach((el) => {
          if (!existing.has(el.dataset.id)) el.remove()
        })

        tasks.forEach((task, idx) => {
          let el = container.querySelector(`[data-id="${task.id}"]`)
          const status = task.status || 'PENDING'

          if (!el) {
            el = document.createElement('div')
            el.className = 'task-item'
            el.dataset.id = task.id
            el.style.animationDelay = idx * 0.08 + 's'

            const avatar = document.createElement('div')
            avatar.className = 'agent-avatar'
            const spriteCanvas = renderSprite(idx)
            const cloned = document.createElement('canvas')
            cloned.width = 32
            cloned.height = 32
            cloned.getContext('2d').drawImage(spriteCanvas, 0, 0)
            avatar.appendChild(cloned)

            const spinnerDiv = document.createElement('div')
            spinnerDiv.className = 'spinner'
            spinnerDiv.style.display = 'none'
            avatar.appendChild(spinnerDiv)

            const info = document.createElement('div')
            info.className = 'task-info'
            const title = document.createElement('div')
            title.className = 'task-title'
            title.textContent = task.title || task.id
            const files = document.createElement('div')
            files.className = 'task-files'
            files.textContent = (task.files || []).join(', ') || 'no files'
            info.appendChild(title)
            info.appendChild(files)

            const badge = document.createElement('span')
            badge.className = 'status-badge pending'
            badge.textContent = 'wait'

            el.appendChild(avatar)
            el.appendChild(info)
            el.appendChild(badge)
            container.appendChild(el)
          } else {
            // Update files display if task has been updated with files
            const filesEl = el.querySelector('.task-files')
            if (filesEl && task.files && task.files.length > 0) {
              filesEl.textContent = task.files.join(', ')
            }
          }

          const badge = el.querySelector('.status-badge')
          const spinner = el.querySelector('.spinner')
          el.classList.remove('running', 'done', 'failed')

          if (status === 'IN_PROGRESS') {
            el.classList.add('running')
            badge.className = 'status-badge running'
            badge.textContent = 'run'
            if (spinner) spinner.style.display = 'block'
          } else if (status === 'DONE') {
            el.classList.add('done')
            badge.className = 'status-badge done'
            badge.textContent = 'done'
            if (spinner) spinner.style.display = 'none'
          } else if (status === 'FAILED') {
            el.classList.add('failed')
            badge.className = 'status-badge failed'
            badge.textContent = 'fail'
            if (spinner) spinner.style.display = 'none'
          } else {
            badge.className = 'status-badge pending'
            badge.textContent = 'wait'
            if (spinner) spinner.style.display = 'none'
          }
        })

        updateStats()
        updatePreviewProgress()
        updateBackendProgress()
      }

      function updateStats() {
        const total = tasks.length
        const done = tasks.filter((t) => t.status === 'DONE').length
        const failed = tasks.filter((t) => t.status === 'FAILED').length

        const timingEl = document.getElementById('gen-timing')
        if (timingEl && !allDone) {
          if (total === 0) {
            timingEl.textContent = 'Planning…'
          } else {
            const elapsed = Math.round((Date.now() - genStartTime) / 1000)
            timingEl.textContent = `Generating… ${done}/${total} pages · ${elapsed}s`
          }
        }

        const pct = total > 0 ? Math.round(((done + failed) / total) * 100) : 0
        document.getElementById('progress-pct').textContent = pct + '%'
        const fill = document.getElementById('progress-fill')
        fill.style.width = pct + '%'
        if (failed > 0) fill.classList.add('has-failures')
        else fill.classList.remove('has-failures')
      }

      function triggerTeleport(taskId) {
        const el = document.querySelector(`[data-id="${taskId}"]`)
        if (el && !el.classList.contains('teleporting')) {
          el.classList.add('teleporting')
        }
      }

      function triggerCompletion() {
        if (allDone) return
        allDone = true

        const banner = document.getElementById('completion-banner')
        banner.classList.add('visible')
        setTimeout(() => banner.classList.remove('visible'), 4000)

        document.getElementById('preview-loading').classList.add('hidden')

        const bp = document.getElementById('backend-progress')
        bp.style.transition = 'opacity 1.5s ease'
        bp.style.opacity = '0'
        setTimeout(() => bp.classList.remove('visible'), 1500)

        if (!frontendComplete) {
          document.getElementById('left-panel').classList.add('collapsed')
          document.getElementById('right-panel').classList.remove('open')
          document.getElementById('right-panel').classList.add('expanded')
        }

        // Always reload preview at completion (nav links were fixed after tasks completed)
        setTimeout(reloadPreview, 800)

        emitCelebrationParticles()
      }

      // ─── Particles ─────────────────────────────────────────────
      const particlesCanvas = document.getElementById('particles-canvas')
      const pCtx = particlesCanvas.getContext('2d')
      let particles = []

      function resizeParticles() {
        particlesCanvas.width = window.innerWidth * devicePixelRatio
        particlesCanvas.height = window.innerHeight * devicePixelRatio
        particlesCanvas.style.width = window.innerWidth + 'px'
        particlesCanvas.style.height = window.innerHeight + 'px'
      }
      resizeParticles()
      window.addEventListener('resize', resizeParticles)

      function emitCelebrationParticles() {
        const colors = ['#7c3aed', '#a78bfa', '#69f0ae', '#ffd740', '#ff6e40', '#40c4ff', '#ea80fc']
        for (let i = 0; i < 60; i++) {
          particles.push({
            x: window.innerWidth * Math.random(),
            y: window.innerHeight + 10,
            vx: (Math.random() - 0.5) * 300,
            vy: -400 - Math.random() * 300,
            color: colors[Math.floor(Math.random() * colors.length)],
            life: 2 + Math.random(),
            maxLife: 2 + Math.random(),
            size: 3 + Math.random() * 4,
          })
        }
      }

      let lastParticleTime = 0
      function animateParticles(now) {
        const dt = Math.min(0.033, (now - lastParticleTime) / 1000)
        lastParticleTime = now

        const dpr = devicePixelRatio
        pCtx.clearRect(0, 0, particlesCanvas.width, particlesCanvas.height)
        pCtx.setTransform(dpr, 0, 0, dpr, 0, 0)

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i]
          p.life -= dt
          p.x += p.vx * dt
          p.y += p.vy * dt
          p.vy += 300 * dt
          if (p.life <= 0) {
            particles.splice(i, 1)
            continue
          }
          const alpha = Math.max(0, p.life / p.maxLife)
          pCtx.globalAlpha = alpha
          pCtx.fillStyle = p.color
          pCtx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size)
        }
        pCtx.globalAlpha = 1
        requestAnimationFrame(animateParticles)
      }
      lastParticleTime = performance.now()
      requestAnimationFrame(animateParticles)

      // ─── Preview iframe loading ─────────────────────────────────
      let preloadStarted = false

      function preloadPreview() {
        if (preloadStarted) return
        preloadStarted = true
        const iframe = document.getElementById('preview-iframe')
        iframe.src = PREVIEW_BASE
        iframe.onload = () => {
          previewLoaded = true
          document.getElementById('url-text').textContent = new URL(PREVIEW_BASE).pathname
          document.getElementById('status-text').textContent = 'Live'
        }
      }

      function loadPreview() {
        if (!preloadStarted) preloadPreview()
        else if (previewLoaded) {
          const iframe = document.getElementById('preview-iframe')
          iframe.src = iframe.src
        }
      }

      function reloadPreview() {
        if (!preloadStarted) return
        const iframe = document.getElementById('preview-iframe')
        iframe.src = PREVIEW_BASE
      }

      // ─── WebSocket: Connect to server ─────────────────────────
      function connectWS() {
        const ws = new WebSocket(WS_URL)

        ws.onopen = () => {
          wsConnected = true
          debugLog('ws_connected', null)
          if (!introActive) {
            document.getElementById('phase-text').textContent = 'Connected'
          }
        }

        ws.onmessage = (e) => {
          let ev
          try {
            ev = JSON.parse(e.data)
          } catch {
            return
          }
          debugLog(ev.type, ev)

          switch (ev.type) {
            case 'prompt':
              introPromptText = ev.text || ''
              break

            case 'status':
              document.getElementById('phase-text').textContent = ev.message || ''
              if (introActive) {
                if (typingDone) {
                  setPhaseLabel(ev.message || '')
                } else {
                  pendingStatus = ev.message || ''
                  // Use first status message as the typed prompt if we don't have one yet
                  if (!introPromptText && ev.message) {
                    introPromptText = ev.message
                  }
                }
              }
              break

            case 'spec_stream':
              break

            case 'tasks_loaded':
              tasks = ev.tasks || []
              taskMap = {}
              tasks.forEach((t) => {
                taskMap[t.id] = t
              })
              genStartTime = Date.now()
              renderTasks()
              // If all tasks already done, hide loading overlay immediately
              {
                const c = getTaskCounts()
                if (c.frontendTotal > 0 && c.frontendDone >= c.frontendTotal) {
                  frontendComplete = true
                  document.getElementById('preview-loading').classList.add('hidden')
                }
              }
              break

            case 'task_updated': {
              const updated = ev.task
              if (!updated) break
              hasSeenLiveUpdate = true
              const idx = tasks.findIndex((t) => t.id === updated.id)
              if (idx >= 0) {
                tasks[idx] = { ...tasks[idx], ...updated }
                taskMap[tasks[idx].id] = tasks[idx]
              } else {
                tasks.push(updated)
                taskMap[updated.id] = updated
              }
              renderTasks()
              if (updated.status === 'DONE') {
                triggerTeleport(updated.id)
                if (isFrontendTask(updated) && previewLoaded) reloadPreview()
                checkAllDone()
              } else if (updated.status === 'FAILED') {
                checkAllDone()
              }
              break
            }

            case 'homepage_ready':
              preloadPreview()
              if (introActive && !hasSeenLiveUpdate) {
                // Reconnect: skip intro, show preview full-width immediately
                isReconnect = true
                skipIntro()
              } else if (introActive) {
                const delay = typingDone ? 600 : 1500
                setTimeout(() => {
                  exitIntro()
                  setTimeout(openDrawer, 400)
                }, delay)
              } else if (drawerOpen) {
                reloadPreview()
              } else {
                openDrawer()
              }
              break

            case 'alternative_design_ready':
              alternativeDesign = ev.design
              document.getElementById('theme-magic-btn').classList.add('ready')
              debugLog('magic_theme_ready', ev.design)
              break

            case 'run_completed':
              document.getElementById('phase-text').textContent = `Done in ${ev.elapsed}s`
              const timingFinal = document.getElementById('gen-timing')
              if (timingFinal)
                timingFinal.textContent = `⚡ Generated in ${ev.elapsed}s — ${ev.completed} pages`
              checkAllDone()
              break

            case 'log':
              appendLog(ev.message || '')
              break
          }
        }

        ws.onclose = () => {
          wsConnected = false
          debugLog('ws_disconnected', null)
          setTimeout(connectWS, 1500)
        }

        ws.onerror = () => {
          ws.close()
        }
      }

      function checkAllDone() {
        if (tasks.length === 0) return
        const pending = tasks.filter((t) => t.status === 'PENDING' || t.status === 'IN_PROGRESS')
        if (pending.length === 0 && !allDone) {
          document.getElementById('phase-text').textContent = 'Tasks complete'
          if (drawerOpen) {
            setTimeout(triggerCompletion, 1500)
          }
        }
      }

      // ─── Log panel ─────────────────────────────────────────────
      function appendLog(msg) {
        const content = document.getElementById('log-content')
        const line = document.createElement('div')
        line.className = 'log-line'
        if (/FAILED|ERROR|EXCEPTION|BLOCKED/i.test(msg)) line.className += ' err'
        else if (/DONE|OK|complete|✓/i.test(msg)) line.className += ' ok'
        else if (/spec|design|generating/i.test(msg)) line.className += ' info'
        line.textContent = msg
        content.appendChild(line)
        content.scrollTop = content.scrollHeight
      }

      document.getElementById('log-toggle').addEventListener('click', () => {
        document.getElementById('log-section').classList.toggle('open')
      })

      // ─── Init ──────────────────────────────────────────────────
      // Fetch session info — load prompt and detect if already done
      fetch(`/api/sessions/${SESSION_ID}`)
        .then((r) => r.json())
        .then((session) => {
          if (session.prompt && !introPromptText) {
            introPromptText = session.prompt
          }
          const isDone = session.taskCount > 0 && session.done === session.taskCount
          if (isDone) {
            const sfx = document.getElementById('launch-sfx')
            if (sfx) sfx.remove()
          }
        })
        .catch(() => {})
      startIntro()
      connectWS()
    </script>
  </body>
