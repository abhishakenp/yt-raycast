    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js'
      import {
        getAuth,
        onAuthStateChanged,
        signInWithPopup,
        GoogleAuthProvider,
        GithubAuthProvider,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        signOut,
      } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js'

      // ─── Firebase init (config from server) ──────────────
      let _auth = null
      let _currentUser = null
      let hasSessionResizeListener = false

      async function initFirebase() {
        const cfg = await fetch('/api/config').then((r) => r.json())
        const app = initializeApp(cfg)
        _auth = getAuth(app)
        return new Promise((resolve) => {
          onAuthStateChanged(_auth, (user) => {
            _currentUser = user
            if (user) {
              showApp()
            } else {
              showOverlay()
            }
            resolve()
          })
        })
      }

      async function getToken() {
        if (!_currentUser) return null
        return _currentUser.getIdToken()
      }

      async function authFetch(url, options = {}) {
        const token = await getToken()
        const headers = { ...(options.headers || {}) }
        if (token) headers['Authorization'] = `Bearer ${token}`
        return fetch(url, { ...options, headers })
      }

      function showOverlay() {
        document.getElementById('auth-overlay').classList.remove('hidden')
        document.getElementById('signout-btn').style.display = 'none'
        document.getElementById('sessions-section').style.display = 'none'
        sessionStorage.removeItem('sf_return_home')
      }

      function showApp() {
        document.getElementById('auth-overlay').classList.add('hidden')
        document.getElementById('signout-btn').style.display = 'flex'
        loadSessions()
      }

      // ─── Auth button handlers ─────────────────────────────
      function setAuthError(msg) {
        document.getElementById('auth-error').textContent = msg
      }

      document.getElementById('google-signin-btn').addEventListener('click', async () => {
        setAuthError('')
        try {
          await signInWithPopup(_auth, new GoogleAuthProvider())
        } catch (err) {
          setAuthError(err.message)
        }
      })

      document.getElementById('github-signin-btn').addEventListener('click', async () => {
        setAuthError('')
        try {
          await signInWithPopup(_auth, new GithubAuthProvider())
        } catch (err) {
          setAuthError(err.message)
        }
      })

      document.getElementById('email-signin-btn').addEventListener('click', async () => {
        setAuthError('')
        const email = document.getElementById('auth-email').value.trim()
        const password = document.getElementById('auth-password').value
        if (!email || !password) return setAuthError('Email and password required')
        try {
          await signInWithEmailAndPassword(_auth, email, password)
        } catch (err) {
          setAuthError(err.message)
        }
      })

      document.getElementById('email-signup-btn').addEventListener('click', async () => {
        setAuthError('')
        const email = document.getElementById('auth-email').value.trim()
        const password = document.getElementById('auth-password').value
        if (!email || !password) return setAuthError('Email and password required')
        try {
          await createUserWithEmailAndPassword(_auth, email, password)
        } catch (err) {
          setAuthError(err.message)
        }
      })

      document.getElementById('signout-btn').addEventListener('click', () => signOut(_auth))

      // ─── Main app ─────────────────────────────────────────
      const form = document.getElementById('prompt-form')
      const input = document.getElementById('prompt-input')
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
        input.value =
          'A multiplayer jet fighter flight simulator with 3D terrain, cockpit HUD, and dogfight mechanics'
      }
      const btn = document.getElementById('submit-btn')
      const genCounter = document.getElementById('gen-counter')
      const promptHelp = document.getElementById('prompt-help')
      const GEN_LIMIT = 5
      const MIN_PROMPT_LENGTH = 70

      function setPromptHelp(message, isError = false) {
        promptHelp.textContent = message
        promptHelp.classList.toggle('is-error', isError)
        if (isError) input.setAttribute('aria-invalid', 'true')
        else input.removeAttribute('aria-invalid')
      }

      function validatePrompt(showError = false) {
        const promptLength = input.value.trim().length
        if (promptLength === 0) {
          setPromptHelp(`Minimum ${MIN_PROMPT_LENGTH} characters.`, false)
          return false
        }
        if (promptLength < MIN_PROMPT_LENGTH) {
          setPromptHelp(
            `Prompt must be at least ${MIN_PROMPT_LENGTH} characters (${promptLength}/${MIN_PROMPT_LENGTH}).`,
            showError,
          )
          return false
        }
        setPromptHelp(`${promptLength} characters.`, false)
        return true
      }

      function isGenLimitReached() {
        return getGenCount() >= GEN_LIMIT
      }

      function syncButtonState() {
        btn.disabled =
          btn.classList.contains('loading') ||
          isGenLimitReached() ||
          input.value.trim().length < MIN_PROMPT_LENGTH
      }

      function getGenCount() {
        return parseInt(localStorage.getItem('sf_generation_count') || '0', 10)
      }

      function updateGenCounter() {
        const count = getGenCount()
        if (count === 0) {
          genCounter.style.display = 'none'
          syncButtonState()
          return
        }
        genCounter.style.display = 'block'
        if (isGenLimitReached()) {
          genCounter.textContent = `Generation limit reached (${GEN_LIMIT}/${GEN_LIMIT}). Clear your browser storage to reset.`
          genCounter.classList.add('limit-reached')
        } else {
          genCounter.textContent = `${count} / ${GEN_LIMIT} generations used`
          genCounter.classList.remove('limit-reached')
        }
        syncButtonState()
      }

      updateGenCounter()
      setPromptHelp(`Minimum ${MIN_PROMPT_LENGTH} characters.`)
      syncButtonState()

      input.addEventListener('input', () => {
        validatePrompt(false)
        syncButtonState()
      })

      // Enter submits, Shift+Enter for newline
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault()
          form.requestSubmit()
        }
      })

      form.addEventListener('submit', async (e) => {
        e.preventDefault()
        if (!validatePrompt(true)) {
          syncButtonState()
          return
        }
        const prompt = input.value.trim()

        if (isGenLimitReached()) {
          updateGenCounter()
          return
        }

        btn.classList.add('loading')
        syncButtonState()

        try {
          const res = await authFetch('/api/sessions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt }),
          })
          const data = await res.json()
          if (data.id) {
            localStorage.setItem('sf_generation_count', getGenCount() + 1)
            sessionStorage.setItem('sf_return_home', '1')
            location.href = `/session/${data.id}`
          } else {
            if (data.error?.includes(`${MIN_PROMPT_LENGTH} characters`)) {
              setPromptHelp(data.error, true)
              input.focus()
            } else {
              alert(data.error || 'Failed to create session')
            }
            btn.classList.remove('loading')
            syncButtonState()
          }
        } catch (err) {
          alert('Connection error: ' + err.message)
          btn.classList.remove('loading')
          syncButtonState()
        }
      })

      async function loadSessions() {
        try {
          const res = await authFetch('/api/sessions')
          const sessions = await res.json()
          const section = document.getElementById('sessions-section')
          const list = document.getElementById('session-list')

          if (sessions.length === 0) {
            list.innerHTML = ''
            section.style.display = 'none'
            document.body.classList.remove('has-sessions')
            list.classList.remove('single-col', 'two-col')
            return
          }

          document.body.classList.add('has-sessions')
          section.style.display = 'block'

          // Adapt grid columns to session count
          list.classList.remove('single-col', 'two-col')
          if (sessions.length === 1) list.classList.add('single-col')
          else if (sessions.length === 2) list.classList.add('two-col')

          const placeholderSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>`

          const eagerThumbnailCount = 6

          list.innerHTML = sessions
            .map(
              (s, idx) => `
            <li class="session-item" data-id="${s.id}" onclick="sessionStorage.setItem('sf_return_home', '1'); location.href='/session/${s.id}'">
              <div class="session-thumbnail">
                ${
                  s.homepageReady
                    ? idx < eagerThumbnailCount
                      ? `<iframe src="/preview/${s.id}/" loading="eager" sandbox="allow-same-origin allow-scripts" tabindex="-1"></iframe>`
                      : `<iframe data-src="/preview/${s.id}/" loading="lazy" sandbox="allow-same-origin allow-scripts" tabindex="-1"></iframe>`
                    : `<div class="session-placeholder">${placeholderSvg}</div>`
                }
                <div class="session-badges">
                  ${s.elapsed ? `<span class="session-badge badge-time"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>${s.elapsed}s</span>` : ''}
                  ${s.cost != null ? `<span class="session-badge badge-cost session-cost" style="display:none">$${s.cost.toFixed(4)}</span>` : ''}
                </div>
              </div>
              <div class="session-info">
                <span class="session-prompt">${s.prompt.replace(/</g, '&lt;')}</span>
              </div>
            </li>
          `,
            )
            .join('')

          // Scale iframes to fit their container width
          const scaleIframes = () => {
            list.querySelectorAll('.session-thumbnail iframe').forEach((iframe) => {
              const containerWidth = iframe.parentElement.offsetWidth
              const scale = containerWidth / 1280
              iframe.style.transform = `scale(${scale})`
            })
          }
          scaleIframes()
          if (!hasSessionResizeListener) {
            window.addEventListener('resize', scaleIframes)
            hasSessionResizeListener = true
          }

          // Lazy-load iframes with IntersectionObserver
          const iframes = list.querySelectorAll('iframe[data-src]')
          if (iframes.length > 0 && 'IntersectionObserver' in window) {
            const observer = new IntersectionObserver(
              (entries) => {
                entries.forEach((entry) => {
                  if (entry.isIntersecting) {
                    const iframe = entry.target
                    iframe.src = iframe.dataset.src
                    observer.unobserve(iframe)
                  }
                })
              },
              { rootMargin: '200px' },
            )
            iframes.forEach((iframe) => observer.observe(iframe))
          } else {
            iframes.forEach((iframe) => {
              iframe.src = iframe.dataset.src
            })
          }
          // Apply cost visibility from localStorage
          if (localStorage.getItem('sf_show_cost') === '1') {
            list.querySelectorAll('.session-cost').forEach((el) => {
              el.style.display = 'flex'
            })
          }
        } catch {
          /* ignore */
        }
      }

      // Secret: press D while hovering a session card to delete it
      let hoveredSessionId = null
      document.addEventListener('mouseover', (e) => {
        const card = e.target.closest('.session-item')
        hoveredSessionId = card ? card.dataset.id : null
      })
      document.addEventListener('keydown', async (e) => {
        if (e.key !== 'd' || !hoveredSessionId) return
        if (
          document.activeElement.tagName === 'TEXTAREA' ||
          document.activeElement.tagName === 'INPUT'
        )
          return
        const id = hoveredSessionId
        const card = document.querySelector(`.session-item[data-id="${id}"]`)
        if (card) card.style.opacity = '0.3'
        await authFetch(`/api/sessions/${id}`, { method: 'DELETE' })
        if (card) card.remove()
        const remaining = document.querySelectorAll('.session-item')
        if (remaining.length === 0) {
          document.getElementById('sessions-section').style.display = 'none'
          document.body.classList.remove('has-sessions')
        } else {
          const list = document.getElementById('session-list')
          list.classList.remove('single-col', 'two-col')
          if (remaining.length === 1) list.classList.add('single-col')
          else if (remaining.length === 2) list.classList.add('two-col')
        }
      })

      // Easter egg: press P to toggle cost display, persisted in localStorage
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'p') return
        if (
          document.activeElement.tagName === 'TEXTAREA' ||
          document.activeElement.tagName === 'INPUT'
        )
          return
        const visible = localStorage.getItem('sf_show_cost') === '1'
        localStorage.setItem('sf_show_cost', visible ? '0' : '1')
        document.querySelectorAll('.session-cost').forEach((el) => {
          el.style.display = visible ? 'none' : 'flex'
        })
      })

      // Easter egg: press D 5 times fast to delete all sessions
      let dPresses = []
      document.addEventListener('keydown', async (e) => {
        if (e.key !== 'd') return
        if (
          document.activeElement.tagName === 'TEXTAREA' ||
          document.activeElement.tagName === 'INPUT'
        )
          return
        const now = Date.now()
        dPresses.push(now)
        dPresses = dPresses.filter((t) => now - t < 1500)
        if (dPresses.length >= 5) {
          dPresses = []
          document.querySelectorAll('.session-item').forEach((c) => {
            c.style.opacity = '0.3'
          })
          await authFetch('/api/sessions', { method: 'DELETE' })
          document.getElementById('session-list').innerHTML = ''
          document.getElementById('sessions-section').style.display = 'none'
          document.body.classList.remove('has-sessions')
        }
      })

      // Wappalyzer detection
      try {
        fetch('chrome-extension://gppongmhjkpfnbhagpmjfkannfbllamg/js/js.js')
          .then(() => {
            document.getElementById('wappalyzer-banner').style.display = 'block'
          })
          .catch(() => {})
      } catch {}

      window.addEventListener('pageshow', (e) => {
        if (e.persisted && _currentUser) loadSessions()
      })

      // ─── Bootstrap ───────────────────────────────────────
      initFirebase()
    </script>
    <!-- ─── Completion banner (top) ─── -->
    <div id="completion-banner" class="completion-banner">
      Generation complete! <span id="completion-time"></span>
    </div>
  </body>
</html>
