<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ship Fast — AI Website Generator in Seconds</title>
    <meta name="description" content="The time to build a SaaS is now measured in seconds. AI-powered full-stack code generation." />
    <meta name="keywords" content="AI website generator, code generation, website builder, AI coding, ship fast" />

    <link rel="canonical" href="https://ship-fast.devliv.io" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ship-fast.devliv.io" />
    <meta property="og:title" content="Ship Fast — AI Website Generator in Seconds" />
    <meta property="og:description" content="The time to build a SaaS is now measured in seconds. AI-powered full-stack code generation." />
    <meta property="og:image" content="https://ship-fast.devliv.io/og-image.png" />
    <meta property="og:image:width" content="1200" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ship Fast — AI Website Generator in Seconds" />
    <meta name="twitter:description" content="The time to build a SaaS is now measured in seconds. AI-powered full-stack code generation." />
    <meta name="twitter:image" content="https://ship-fast.devliv.io/og-image.png" />

    <!-- Plausible Analytics (proxied) -->
    <script defer data-domain="ship-fast.devliv.io" data-api="/api/event" src="/js/script.js"></script>

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Ship Fast",
        "description": "AI-powered website generator. Describe a website and get it built in seconds.",
        "url": "https://ship-fast.devliv.io",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Web",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap');
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #000;
        font-family: 'Inter', system-ui, sans-serif;
        color: #e2e0f0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow-x: hidden;
      }

      /* ─── Ambient glow ─── */
      .bg-glow {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
      }
      .bg-glow::before {
        content: '';
        position: absolute;
        top: 15%;
        left: 50%;
        transform: translateX(-50%);
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, rgba(124, 58, 237, 0.08) 0%, transparent 70%);
        border-radius: 50%;
        animation: glowPulse 4s ease-in-out infinite;
      }
      @keyframes glowPulse {
        0%,
        100% {
          opacity: 0.6;
          transform: translateX(-50%) scale(1);
        }
        50% {
          opacity: 1;
          transform: translateX(-50%) scale(1.15);
        }
      }

      .container {
        position: relative;
        z-index: 1;
        max-width: 640px;
        width: 100%;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      body.has-sessions {
        justify-content: flex-start;
        overflow-y: auto;
      }
      body.has-sessions .container {
        margin-top: 80px;
      }

      /* ─── Logo ─── */
      .logo {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 16px;
      }
      .logo-icon {
        width: 64px;
        height: 64px;
      }
      .logo-icon svg {
        width: 100%;
        height: 100%;
      }
      .logo-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 56px;
        font-weight: 700;
        letter-spacing: 5px;
        background: linear-gradient(135deg, #7c3aed 0%, #a78bfa 40%, #c4b5fd 60%, #7c3aed 100%);
        background-size: 200% 200%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: gradientShift 3s ease infinite;
        filter: drop-shadow(0 0 20px rgba(124, 58, 237, 0.3));
      }
      @keyframes gradientShift {
        0%,
        100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
      }

      .subtitle {
        font-size: 18px;
        color: #c4b5fd;
        margin-bottom: 40px;
        letter-spacing: 0.3px;
        text-align: center;
        line-height: 1.5;
        max-width: 520px;
        font-weight: 500;
      }

      /* ─── Input area ─── */
      .input-group {
        display: flex;
        flex-direction: column;
        gap: 14px;
        width: 100%;
        margin-bottom: 0;
      }
      .prompt-input {
        width: 100%;
        min-height: 120px;
        padding: 16px 18px;
        background: #0f0d1a;
        border: 1px solid #2d2a3e;
        border-radius: 12px;
        color: #e2e0f0;
        font-family: 'Inter', sans-serif;
        font-size: 15px;
        line-height: 1.5;
        outline: none;
        resize: vertical;
        transition:
          border-color 0.25s,
          box-shadow 0.25s;
      }
      .prompt-input:focus {
        border-color: #7c3aed;
        box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
      }
      .prompt-input::placeholder {
        color: #4a4660;
      }

      .submit-btn {
        align-self: flex-end;
        padding: 16px 28px;
        background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
        color: #fff;
        border: none;
        border-radius: 12px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
        transition:
          opacity 0.2s,
          transform 0.15s,
          box-shadow 0.25s;
        white-space: nowrap;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      .submit-btn:hover {
        opacity: 0.9;
        box-shadow: 0 0 24px rgba(124, 58, 237, 0.3);
      }
      .submit-btn:active {
        transform: scale(0.97);
      }
      .submit-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: none;
      }
      .submit-btn .zap-icon {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }
      .gen-counter {
        font-size: 12px;
        color: #6b6880;
        text-align: right;
        margin-top: 8px;
        font-family: 'JetBrains Mono', monospace;
      }
      .gen-counter.limit-reached {
        color: #ef4444;
      }

      .spinner {
        display: none;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.25);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
      }
      .loading .spinner {
        display: inline-block;
      }
      .loading .btn-label {
        display: none;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ─── Sessions grid ─── */
      .sessions {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 1200px;
        margin-top: 48px;
        border-top: 1px solid #2d2a3e;
        padding: 20px 2rem 60px;
      }
      .sessions h2 {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        color: rgba(167, 139, 250, 0.5);
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 16px;
      }
      .session-list {
        list-style: none;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .session-list.single-col {
        grid-template-columns: 1fr;
        max-width: 480px;
      }
      .session-list.two-col {
        grid-template-columns: repeat(2, 1fr);
      }
      @media (max-width: 900px) {
        .session-list {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 560px) {
        .session-list, .session-list.two-col {
          grid-template-columns: 1fr;
        }
      }
      .session-item {
        display: flex;
        flex-direction: column;
        background: #0f0d1a;
        border: 1px solid #2d2a3e;
        border-radius: 12px;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.25s,
          transform 0.15s;
        overflow: hidden;
      }
      .session-item:hover {
        background: #16132a;
        border-color: #7c3aed;
        transform: translateY(-2px);
      }
      .session-thumbnail {
        width: 100%;
        aspect-ratio: 16 / 10;
        overflow: hidden;
        position: relative;
        background: #0a0818;
        border-radius: 11px 11px 0 0;
      }
      .session-thumbnail iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 1280px;
        height: 800px;
        border: none;
        transform-origin: top left;
        pointer-events: none;
      }
      .session-badges {
        position: absolute;
        top: 8px;
        right: 8px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
        z-index: 2;
      }
      .session-badge {
        display: flex;
        align-items: center;
        gap: 4px;
        backdrop-filter: blur(6px);
        color: #fff;
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 600;
        padding: 3px 8px;
        border-radius: 6px;
        letter-spacing: 0.3px;
      }
      .badge-time {
        background: rgba(124, 58, 237, 0.85);
      }
      .badge-cost {
        background: rgba(16, 185, 129, 0.85);
      }
      .session-placeholder {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #2d2a3e;
      }
      .session-placeholder svg {
        width: 40px;
        height: 40px;
        opacity: 0.5;
      }
      .session-info {
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        border-top: 1px solid #2d2a3e;
      }
      .session-prompt {
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 5;
        -webkit-box-orient: vertical;
        font-size: 13px;
        line-height: 1.45;
        color: #e2e0f0;
      }
      .session-meta {
        font-family: 'JetBrains Mono', monospace;
        color: #8b86a8;
        font-size: 11px;
        white-space: nowrap;
        align-self: flex-end;
      }

      .wappalyzer-banner {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: #22c55e;
        color: #000;
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        font-weight: 600;
        text-align: center;
        padding: 6px 12px;
        z-index: 100;
      }

      .social-links {
        position: fixed;
        bottom: 20px;
        left: 24px;
        display: flex;
        align-items: center;
        gap: 16px;
        z-index: 10;
      }
      .social-links a {
        color: #4a4660;
        transition: color 0.2s;
        display: flex;
        align-items: center;
      }
      .social-links a:hover {
        color: #a78bfa;
      }
      .social-links a svg {
        width: 18px;
        height: 18px;
      }
    </style>
  </head>
  <body>
    <div class="wappalyzer-banner" id="wappalyzer-banner">Sorry, Wappalyzer won't help you this time 😎</div>
    <div class="bg-glow"></div>

    <div class="container">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M26 4L8 20L14 22L26 10L38 22L44 20L26 4Z" fill="url(#g1)" opacity="0.9" />
            <path d="M14 22L14 40L22 36V24L14 22Z" fill="url(#g2)" opacity="0.8" />
            <path d="M38 22L38 40L30 36V24L38 22Z" fill="url(#g2)" opacity="0.8" />
            <path d="M22 24V36L26 38L30 36V24L26 20L22 24Z" fill="url(#g1)" />
            <path d="M22 38L26 48L30 38L26 40L22 38Z" fill="#a78bfa" opacity="0.7" />
            <circle cx="26" cy="16" r="2" fill="#c4b5fd" />
            <defs>
              <linearGradient id="g1" x1="8" y1="4" x2="44" y2="48" gradientUnits="userSpaceOnUse">
                <stop stop-color="#7c3aed" />
                <stop offset="1" stop-color="#a78bfa" />
              </linearGradient>
              <linearGradient
                id="g2"
                x1="14"
                y1="22"
                x2="38"
                y2="40"
                gradientUnits="userSpaceOnUse"
              >
                <stop stop-color="#6d28d9" />
                <stop offset="1" stop-color="#7c3aed" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <span class="logo-text">SHIP FAST</span>
      </div>

      <p class="subtitle">
        The time to build a SaaS is now measured in seconds.
      </p>

      <form id="prompt-form" class="input-group">
        <textarea
          class="prompt-input"
          id="prompt-input"
          placeholder="A modern SaaS landing page for a time tracking app..."
          autofocus
          autocomplete="off"
          rows="4"
        ></textarea>
        <button type="submit" class="submit-btn" id="submit-btn">
          <svg
            class="zap-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
          </svg>
          <span class="btn-label">GENERATE</span>
          <div class="spinner"></div>
        </button>
      </form>
      <div class="gen-counter" id="gen-counter" style="display:none"></div>

    </div>

    <div class="sessions" id="sessions-section" style="display: none">
      <h2>Recent Sessions</h2>
      <ul class="session-list" id="session-list"></ul>
    </div>

    <div class="social-links">
      <a href="https://liviogama.com" target="_blank" rel="noopener" aria-label="Website">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      </a>
      <a href="https://www.linkedin.com/in/livio-gamassia/" target="_blank" rel="noopener" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
      </a>
      <a href="https://x.com/LivioGama" target="_blank" rel="noopener" aria-label="X">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      </a>
    </div>

    <script>
      const form = document.getElementById('prompt-form')
      const input = document.getElementById('prompt-input')
      const btn = document.getElementById('submit-btn')
      const genCounter = document.getElementById('gen-counter')
      const GEN_LIMIT = 5

      function getGenCount() {
        return parseInt(localStorage.getItem('sf_generation_count') || '0', 10)
      }

      function updateGenCounter() {
        const count = getGenCount()
        if (count === 0) {
          genCounter.style.display = 'none'
          return
        }
        genCounter.style.display = 'block'
        if (count >= GEN_LIMIT) {
          genCounter.textContent = `Generation limit reached (${GEN_LIMIT}/${GEN_LIMIT}). Clear your browser storage to reset.`
          genCounter.classList.add('limit-reached')
          btn.disabled = true
        } else {
          genCounter.textContent = `${count} / ${GEN_LIMIT} generations used`
          genCounter.classList.remove('limit-reached')
        }
      }

      updateGenCounter()

      // Enter submits, Shift+Enter for newline
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault()
          form.requestSubmit()
        }
      })

      form.addEventListener('submit', async (e) => {
        e.preventDefault()
        const prompt = input.value.trim()
        if (!prompt) return

        if (getGenCount() >= GEN_LIMIT) {
          updateGenCounter()
          return
        }

        btn.disabled = true
        btn.classList.add('loading')

        try {
          const res = await fetch('/api/sessions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt }),
          })
          const data = await res.json()
          if (data.id) {
            localStorage.setItem('sf_generation_count', getGenCount() + 1)
            location.href = `/session/${data.id}`
          } else {
            alert(data.error || 'Failed to create session')
            btn.disabled = false
            btn.classList.remove('loading')
          }
        } catch (err) {
          alert('Connection error: ' + err.message)
          btn.disabled = false
          btn.classList.remove('loading')
        }
      })

      async function loadSessions() {
        try {
          const res = await fetch('/api/sessions')
          const sessions = await res.json()
          if (sessions.length === 0) return

          document.body.classList.add('has-sessions')
          const section = document.getElementById('sessions-section')
          const list = document.getElementById('session-list')
          section.style.display = 'block'

          // Adapt grid columns to session count
          if (sessions.length === 1) list.classList.add('single-col')
          else if (sessions.length === 2) list.classList.add('two-col')

          const placeholderSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>`

          list.innerHTML = sessions
            .map(
              (s) => `
            <li class="session-item" data-id="${s.id}" onclick="location.href='/session/${s.id}'">
              <div class="session-thumbnail">
                ${s.homepageReady
                  ? `<iframe data-src="/preview/${s.id}/" loading="lazy" sandbox="allow-same-origin allow-scripts" tabindex="-1"></iframe>`
                  : `<div class="session-placeholder">${placeholderSvg}</div>`
                }
                <div class="session-badges">
                  ${s.elapsed ? `<span class="session-badge badge-time"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>${s.elapsed}s</span>` : ''}
                  ${s.cost != null ? `<span class="session-badge badge-cost session-cost" style="display:none">$${s.cost.toFixed(4)}</span>` : ''}
                </div>
              </div>
              <div class="session-info">
                <span class="session-prompt">${s.prompt.replace(/</g, '&lt;')}</span>
              </div>
            </li>
          `,
            )
            .join('')

          // Scale iframes to fit their container width
          const scaleIframes = () => {
            list.querySelectorAll('.session-thumbnail iframe').forEach((iframe) => {
              const containerWidth = iframe.parentElement.offsetWidth
              const scale = containerWidth / 1280
              iframe.style.transform = `scale(${scale})`
            })
          }
          scaleIframes()
          window.addEventListener('resize', scaleIframes)

          // Lazy-load iframes with IntersectionObserver
          const iframes = list.querySelectorAll('iframe[data-src]')
          if (iframes.length > 0 && 'IntersectionObserver' in window) {
            const observer = new IntersectionObserver((entries) => {
              entries.forEach((entry) => {
                if (entry.isIntersecting) {
                  const iframe = entry.target
                  iframe.src = iframe.dataset.src
                  observer.unobserve(iframe)
                }
              })
            }, { rootMargin: '200px' })
            iframes.forEach((iframe) => observer.observe(iframe))
          } else {
            iframes.forEach((iframe) => { iframe.src = iframe.dataset.src })
          }
          // Apply cost visibility from localStorage
          if (localStorage.getItem('sf_show_cost') === '1') {
            list.querySelectorAll('.session-cost').forEach((el) => { el.style.display = 'flex' })
          }
        } catch {
          /* ignore */
        }
      }

      loadSessions()

      // Secret: press D while hovering a session card to delete it
      let hoveredSessionId = null
      document.addEventListener('mouseover', (e) => {
        const card = e.target.closest('.session-item')
        hoveredSessionId = card ? card.dataset.id : null
      })
      document.addEventListener('keydown', async (e) => {
        if (e.key !== 'd' || !hoveredSessionId) return
        if (document.activeElement.tagName === 'TEXTAREA' || document.activeElement.tagName === 'INPUT') return
        const id = hoveredSessionId
        const card = document.querySelector(`.session-item[data-id="${id}"]`)
        if (card) card.style.opacity = '0.3'
        await fetch(`/api/sessions/${id}`, { method: 'DELETE' })
        if (card) card.remove()
        const remaining = document.querySelectorAll('.session-item')
        if (remaining.length === 0) {
          document.getElementById('sessions-section').style.display = 'none'
          document.body.classList.remove('has-sessions')
        } else {
          const list = document.getElementById('session-list')
          list.classList.remove('single-col', 'two-col')
          if (remaining.length === 1) list.classList.add('single-col')
          else if (remaining.length === 2) list.classList.add('two-col')
        }
      })

      // Easter egg: press P to toggle cost display, persisted in localStorage
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'p') return
        if (document.activeElement.tagName === 'TEXTAREA' || document.activeElement.tagName === 'INPUT') return
        const visible = localStorage.getItem('sf_show_cost') === '1'
        localStorage.setItem('sf_show_cost', visible ? '0' : '1')
        document.querySelectorAll('.session-cost').forEach((el) => {
          el.style.display = visible ? 'none' : 'flex'
        })
      })

      // Easter egg: press D 5 times fast to delete all sessions
      let dPresses = []
      document.addEventListener('keydown', async (e) => {
        if (e.key !== 'd') return
        if (document.activeElement.tagName === 'TEXTAREA' || document.activeElement.tagName === 'INPUT') return
        const now = Date.now()
        dPresses.push(now)
        dPresses = dPresses.filter((t) => now - t < 1500)
        if (dPresses.length >= 5) {
          dPresses = []
          document.querySelectorAll('.session-item').forEach((c) => { c.style.opacity = '0.3' })
          await fetch('/api/sessions', { method: 'DELETE' })
          document.getElementById('session-list').innerHTML = ''
          document.getElementById('sessions-section').style.display = 'none'
          document.body.classList.remove('has-sessions')
        }
      })

      // Wappalyzer detection
      try {
        fetch('chrome-extension://gppongmhjkpfnbhagpmjfkannfbllamg/js/js.js')
          .then(() => { document.getElementById('wappalyzer-banner').style.display = 'block' })
          .catch(() => {})
      } catch {}
    </script>
  </body>
</html>
