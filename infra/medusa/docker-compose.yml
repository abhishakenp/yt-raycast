# Shared Medusa infrastructure for ship-fast's container-per-tenant model.
#
# This compose file serves two purposes:
#  1. `docker compose -f infra/medusa/docker-compose.yml up -d postgres redis`
#     boots the shared postgres + redis that every tenant Medusa container
#     attaches to. Each session gets its own Postgres DATABASE inside the
#     shared `postgres` server, but containers/Redis are shared.
#  2. src/server/medusa-provision.js reads this file as a template to extract
#     the STORE_CORS / ADMIN_CORS / AUTH_CORS defaults below — the
#     extractTemplateCors regex matches the literal `KEY: ${KEY:-default}`
#     lines under `x-medusa-cors-defaults`.
#
# Bring up: `bun run medusa:up`     Tear down: `bun run medusa:down`

x-medusa-cors-defaults: &medusa-cors-defaults
  STORE_CORS: ${STORE_CORS:-http://localhost:3000,http://localhost:7420,http://localhost:7430,http://127.0.0.1:3000,http://127.0.0.1:7420,http://127.0.0.1:7430}
  ADMIN_CORS: ${ADMIN_CORS:-http://localhost:9000,http://127.0.0.1:9000,http://localhost:7420,http://127.0.0.1:7420}
  AUTH_CORS: ${AUTH_CORS:-http://localhost:9000,http://127.0.0.1:9000,http://localhost:3000,http://localhost:7420,http://127.0.0.1:3000,http://127.0.0.1:7420}

services:
  postgres:
    image: postgres:16-alpine
    container_name: medusa-postgres-1
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MEDUSA_POSTGRES_USER:-medusa}
      POSTGRES_PASSWORD: ${MEDUSA_POSTGRES_PASSWORD:-medusa}
      POSTGRES_DB: ${MEDUSA_POSTGRES_DB:-medusa}
    ports:
      - "${MEDUSA_POSTGRES_PORT:-5433}:5432"
    volumes:
      - medusa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MEDUSA_POSTGRES_USER:-medusa}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - medusa_net

  redis:
    image: redis:7-alpine
    container_name: medusa-redis-1
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${MEDUSA_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - medusa_net

volumes:
  medusa_postgres_data:

# Named so per-session compose files can attach with `external: true`.
networks:
  medusa_net:
    name: medusa_default
